name: Validate catalog tooling
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Reject private keys and APK binaries in source control
        run: |
          python - <<'PY'
          import pathlib, subprocess
          for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not name: continue
              path = pathlib.Path(name)
              data = path.read_bytes()
              if path.suffix in {'.pem', '.key', '.p12', '.apk'} or b'-----BEGIN ' + b'PRIVATE KEY-----' in data or b'-----BEGIN ENCRYPTED ' + b'PRIVATE KEY-----' in data:
                  raise SystemExit('Forbidden sensitive/binary file: ' + name)
          PY
