name: Prepare unsigned app candidate
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare newly discovered versions or preserve the approved versions
        type: choice
        options: [latest, preserve-approved]
        default: latest
  push:
    branches: [main]
    paths: [releases/build-request.json]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Select preparation mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ.get('REQUESTED_MODE') or json.loads(Path('releases/build-request.json').read_text()).get('mode', 'latest')
          if mode not in ('latest', 'preserve-approved'): raise SystemExit('Invalid preparation mode')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('value=' + mode + '\n')
          PY
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Download untrusted upstream APKs
        if: steps.mode.outputs.value == 'latest'
        run: python -m catalog.discover --output incoming
      - name: Check APK signatures, identities and hashes
        if: steps.mode.outputs.value == 'latest'
        run: |
          python -m catalog.candidate --apks incoming --output candidate \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Preserve APKs from the previously signed catalog
        if: steps.mode.outputs.value == 'preserve-approved'
        run: |
          python -m catalog.restore_approved --request releases/build-request.json --output candidate \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Package signing kit
        run: python -m catalog.package_candidate
      - name: Stage preserved APK assets
        run: python -m catalog.artifacts stage --candidate candidate --output preserved
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signing-kit
          path: |
            downloads/
            preserved/
          compression-level: 0
          retention-days: 7
  publish-download:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: preserved-catalog-apks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signing-kit
          path: bundle
      - name: Publish and verify preserved APK assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python -m catalog.artifacts publish --staged bundle/preserved --commit "$RELEASE_COMMIT"
      - name: Publish unsigned signing kit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: catalog-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd bundle/downloads
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --prerelease \
            --title "App catalog signing kit" \
            --notes-file SIGNING.txt \
            StellarOS-AppCatalog-signing-kit.zip SHA256SUMS SIGNING.txt
# Only unsigned candidates are published here. Production signing stays offline.
